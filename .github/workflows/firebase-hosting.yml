name: Flutter Web CI and Firebase Hosting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build API and shared package
        run: npm run build

      - name: Test API
        run: npm test --workspace @app-studymate/api

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Test Flutter app
        working-directory: apps/mobile
        run: flutter test

      - name: Build Flutter Web
        working-directory: apps/mobile
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPSTUDYMATE_13DE0 }}
          projectId: appstudymate-13de0
          channelId: live
